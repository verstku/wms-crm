name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wms_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          working-directory: backend
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy app
      - name: Pytest
        run: uv run pytest
      - name: Alembic check
        env:
          USE_TEST_DATABASE: "true"
        run: uv run alembic upgrade head && uv run alembic check

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          working-directory: backend
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Generate API types
        run: npm run gen:api
      - name: Check API types are up to date
        working-directory: ${{ github.workspace }}
        # gen:api recreates a file deleted from git as untracked, and git diff ignores
        # untracked files, so first check that both files are tracked.
        run: |
          git ls-files --error-unmatch -- frontend/openapi.json frontend/src/lib/api/schema.d.ts
          git diff --exit-code -- frontend/openapi.json frontend/src/lib/api/schema.d.ts

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wms_crm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          working-directory: backend
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
